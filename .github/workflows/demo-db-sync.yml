name: Demo DB sync

# Manual only, for now -- this never fires on its own. Once the setup
# checklist is done and we've watched a first run succeed, we can add
# an automatic push trigger (path-filtered to supabase/migrations/** and
# supabase/demo/**). Until then, nothing touches the demo project
# without someone explicitly clicking "Run workflow".
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Hard stop before anything else runs: DEMO_DB_URL must never be
      # able to reach the production project, by secret misconfiguration
      # or copy-paste error.
      - name: Refuse to run against the production project
        env:
          DEMO_DB_URL: ${{ secrets.DEMO_DB_URL }}
        run: |
          if [[ "$DEMO_DB_URL" == *"xydmvmgmxrorqnxzrrql"* ]]; then
            echo "::error::DEMO_DB_URL resolves to the production project (xydmvmgmxrorqnxzrrql). Aborting -- this workflow must only ever target the demo project." >&2
            exit 1
          fi

      - uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.120.0

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # DEMO_DB_URL must be the demo project's Session pooler connection
      # string (Settings -> Database -> Connection string -> "Session
      # pooler"), not the direct connection -- GitHub-hosted runners have
      # no IPv6, and the direct connection is IPv6-only. Session mode
      # (not Transaction mode) also preserves the session state that
      # \gset and SET rely on in reseed.sql/seed.sql below.
      - name: Push migrations to the demo project
        env:
          DEMO_DB_URL: ${{ secrets.DEMO_DB_URL }}
        run: supabase db push --db-url "$DEMO_DB_URL" --yes

      - name: Reseed the demo project
        env:
          DEMO_DB_URL: ${{ secrets.DEMO_DB_URL }}
          DEMO_OWNER_EMAIL: ${{ secrets.DEMO_OWNER_EMAIL }}
        run: |
          psql "$DEMO_DB_URL" \
            --single-transaction \
            -v ON_ERROR_STOP=1 \
            -v demo_owner_email="$DEMO_OWNER_EMAIL" \
            -f supabase/demo/reseed.sql
