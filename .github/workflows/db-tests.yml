name: Database tests

# Local Docker isn't available on the dev machine for this project, so
# the Supabase local stack (and the pgTAP suite that needs it) only
# ever runs here, on GitHub's own runners, which have Docker preinstalled.
#
# Pull requests, plus pushes straight to main (a merge or a direct
# commit) -- not every push to a feature branch too, since a PR push
# already triggers the pull_request event. This is a private repo on
# the free plan, so Actions minutes are limited.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.120.0

      - name: Start the local Supabase stack
        run: supabase start

      - name: Apply migrations and seed data
        run: supabase db reset

      - name: Run pgTAP tests
        run: supabase test db
