name: Database tests

# Local Docker isn't available on the dev machine for this project, so
# the Supabase local stack (and the pgTAP suite that needs it) only
# ever runs here, on GitHub's own runners, which have Docker preinstalled.
#
# Pull requests, plus pushes straight to main (a merge or a direct
# commit) -- not every push to a feature branch too, since a PR push
# already triggers the pull_request event. This is a private repo on
# the free plan, so Actions minutes are limited.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.120.0

      # DOCKERHUB_TOKEN expires never — regenerate at hub.docker.com
      # Read-only on public images; it exists only to lift the
      # anonymous pull rate limit that has failed this job three times.
      # registry is explicit: a bare `docker login` stores credentials
      # under the index.docker.io key, which some Docker CLI versions
      # don't match against pulls resolved to registry-1.docker.io --
      # pinning docker.io here is what makes supabase start's own pulls
      # actually use this login instead of silently falling back to an
      # anonymous one.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3.3.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Proves the login above is actually in effect, rather than
      # assuming it from a successful `docker login` -- Docker Hub's
      # authenticated rate limit is well above the anonymous one, so a
      # higher ratelimit-limit here confirms pulls below are
      # authenticated, not silently anonymous.
      - name: Confirm the Docker Hub login is being used for pulls
        run: |
          token=$(curl -sf -u "${{ secrets.DOCKERHUB_USERNAME }}:${{ secrets.DOCKERHUB_TOKEN }}" \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/alpine:pull" \
            | sed -E 's/.*"token":"([^"]+)".*/\1/')
          curl -sI -H "Authorization: Bearer $token" \
            "https://registry-1.docker.io/v2/library/alpine/manifests/latest" \
            | grep -i ratelimit

      - name: Start the local Supabase stack
        run: supabase start

      - name: Apply migrations and seed data
        run: supabase db reset

      - name: Run pgTAP tests
        run: supabase test db
