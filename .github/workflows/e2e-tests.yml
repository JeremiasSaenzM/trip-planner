name: End-to-end tests

# Drives the real UI with Playwright, against the same local Supabase
# stack db-tests.yml spins up -- the only Supabase project this repo has
# is the real, hosted one (see CLAUDE.md's "no second Supabase project"
# rule), so every write-path form gets rehearsed here, in CI, never by
# hand against real data.
#
# Pull requests, plus pushes straight to main (a merge or a direct
# commit) -- not every push to a feature branch too, since a PR push
# already triggers the pull_request event. This is a private repo on
# the free plan, so Actions minutes are limited.
on:
  push:
    branches: [main]
  pull_request:

# Cancels a run already superseded by a newer push on the same branch --
# no coverage lost, just the minutes a stale run would otherwise burn.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    env:
      E2E_TEST_EMAIL: e2e-test@example.com
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.120.0

      # DOCKERHUB_TOKEN expires never — regenerate at hub.docker.com
      # Read-only on public images; it exists only to lift the
      # anonymous pull rate limit that has failed this job three times.
      # registry is explicit: a bare `docker login` stores credentials
      # under the index.docker.io key, which some Docker CLI versions
      # don't match against pulls resolved to registry-1.docker.io --
      # pinning docker.io here is what makes supabase start's own pulls
      # actually use this login instead of silently falling back to an
      # anonymous one.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3.3.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Proves the login above is actually in effect, rather than
      # assuming it from a successful `docker login` -- Docker Hub's
      # authenticated rate limit is well above the anonymous one, so a
      # higher ratelimit-limit here confirms pulls below are
      # authenticated, not silently anonymous.
      - name: Confirm the Docker Hub login is being used for pulls
        run: |
          token=$(curl -sf -u "${{ secrets.DOCKERHUB_USERNAME }}:${{ secrets.DOCKERHUB_TOKEN }}" \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/alpine:pull" \
            | sed -E 's/.*"token":"([^"]+)".*/\1/')
          curl -sI -H "Authorization: Bearer $token" \
            "https://registry-1.docker.io/v2/library/alpine/manifests/latest" \
            | grep -i ratelimit

      - name: Start the local Supabase stack
        run: supabase start

      - name: Apply migrations and seed data
        run: supabase db reset

      # Prints API_URL/ANON_KEY/SERVICE_ROLE_KEY (among others) as
      # KEY="value" lines -- this CLI version's actual local values,
      # rather than hardcoding the well-known demo defaults and risking
      # a mismatch with this repo's supabase/config.toml. The sed strips
      # the surrounding quotes GITHUB_ENV would otherwise keep as part
      # of the value.
      - name: Export local Supabase connection details
        run: |
          supabase status -o env | sed -E 's/^([A-Z_]+)="?([^"]*)"?$/\1=\2/' >> "$GITHUB_ENV"

      # The login form only ever calls signInWithOtp with
      # shouldCreateUser: false (src/app/login/actions.ts), so this user
      # has to exist before the suite can log in as it at all.
      - name: Create the E2E test auth user
        run: |
          curl -sf -X POST "$API_URL/auth/v1/admin/users" \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"email\": \"$E2E_TEST_EMAIL\", \"email_confirm\": true}"

      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      - name: Build the app against the local stack
        run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.ANON_KEY }}
          ALLOWED_EMAIL: ${{ env.E2E_TEST_EMAIL }}

      - name: Start the app in the background
        run: nohup npx next start > next-start.log 2>&1 &
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.ANON_KEY }}
          ALLOWED_EMAIL: ${{ env.E2E_TEST_EMAIL }}

      - name: Wait for the app to respond
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000 > /dev/null && exit 0
            sleep 1
          done
          echo "App never came up:"
          cat next-start.log
          exit 1

      - name: Run Playwright
        run: npx playwright test
        env:
          E2E_TEST_EMAIL: ${{ env.E2E_TEST_EMAIL }}

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
